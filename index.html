<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eNTckidu</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1d45'/%3E%3Ctext x='32' y='49' text-anchor='middle' font-family='Cormorant Garamond,Garamond,Georgia,serif' font-weight='700' font-size='70' fill='%23efe7d4'%3Ee%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4vh;
      padding: 6vw;
      text-align: center;
      /* deep blue, slightly lighter in the middle */
      background: radial-gradient(ellipse at center, #13306b 0%, #0b1d45 55%, #06122d 100%);
      color: #efe7d4;
    }

    /* Line 1: the name */
    .name {
      font-family: "Cinzel", "Trajan Pro", "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(3rem, 14vw, 11rem);
      line-height: 1;
      letter-spacing: 0.06em;
      color: #efe7d4;            /* ivory / marble */
      white-space: nowrap;
    }

    /* the "c": reduced size, on the baseline */
    .name .c {
      font-size: 0.8em;
    }

    /* the "e": a true lowercase e (Cinzel has none, so it comes from
       Cormorant Garamond Bold), sized to stand exactly as tall as the "c" */
    .name .e {
      font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif;
      font-weight: 700;
      font-size: 1.24em;
      letter-spacing: 0.03em;
    }

    /* the "u": a little smaller and lifted, so the "u" plus its line together
       fill the same height as the letters beside it. The line is the letter's
       own underline, raised so it rests exactly on the shared baseline. */
    .name .u {
      position: relative;
      top: -0.145em;             /* = underline offset + thickness */
      font-size: 0.8em;
      letter-spacing: 0;         /* keeps the line exactly as wide as the u */
      text-decoration: underline;
      text-decoration-thickness: 0.055em;
      text-underline-offset: 0.09em;
    }

    /* Lines 2 and 3 */
    .tagline {
      font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(1.1rem, min(4.6vh, 6.4vw), 3rem);
      line-height: 1.35;
      letter-spacing: 0.02em;
      color: #a8d2f2;            /* light blue */
    }

    .tagline span { display: block; }

    /* Row of record photos under the text (static) */
    .records {
      display: flex;
      justify-content: center;
      gap: clamp(0.6rem, 1.6vw, 1.5rem);
      margin-top: 2vh;
      list-style: none;
    }

    .records li {
      width: clamp(5.5rem, min(13vw, 17vh), 11rem);
      aspect-ratio: 1 / 1;
      padding: 0.3rem;
      border: 1px solid rgba(239, 231, 212, 0.55);   /* thin ivory frame */
    }

    .records img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;          /* crops each photo to a square, no stretching */
    }

    /* phones: show the middle 3 photos so they stay big enough to see */
    @media (max-width: 600px) {
      .records li:first-child,
      .records li:last-child { display: none; }
      .records li { width: 26vw; }
    }
  </style>
</head>
<body>
  <h1 class="name" aria-label="eNTckidu"><span class="e">e</span>NT<span class="c">c</span>kid<span class="u">u</span></h1>
  <p class="tagline">
    <span>(more likely) slowly, but surely</span>
    <span>is back</span>
  </p>
  <ul class="records">
    <li><img src="images/jane-here-we-are.jpg" alt="Jane – Here We Are" width="600" height="600"></li>
    <li><img src="images/thin-lizzy-chinatown.jpg" alt="Thin Lizzy – Chinatown" width="600" height="600"></li>
    <li><img src="images/king-crimson-lizard.jpg" alt="King Crimson – Lizard" width="600" height="600"></li>
    <li><img src="images/talking-heads-naked.jpg" alt="Talking Heads – Naked" width="600" height="600"></li>
    <li><img src="images/experimental.jpg" alt="Experimental" width="600" height="600"></li>
  </ul>
</body>
</html>
