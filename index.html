<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eNTckidu</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1d45'/%3E%3Ctext x='32' y='49' text-anchor='middle' font-family='Cormorant Garamond,Garamond,Georgia,serif' font-weight='700' font-size='70' fill='%23efe7d4'%3Ee%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* shared sizes: the LP row and the drawings mosaic use the same grid */
    :root {
      --tile: clamp(6.5rem, min(17vw, 25vh), 14rem);   /* one LP square (bigger) */
      --gap: clamp(0.6rem, 1.6vw, 1.5rem);
      --cols: 5;
    }

    html { background: #06122d; }   /* page colour beyond the gradient */

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;   /* content starts near the top */
      gap: 4vh;
      padding: 7vh 6vw 8vh;
      text-align: center;
      /* deep blue, slightly lighter in the middle */
      background: radial-gradient(ellipse 120% 70% at 50% 30%, #13306b 0%, #0b1d45 55%, #06122d 100%) no-repeat;
      color: #efe7d4;
    }

    /* Line 1: the name */
    .name {
      font-family: "Cinzel", "Trajan Pro", "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(2.25rem, 10.5vw, 8.25rem);   /* a quarter smaller than before */
      line-height: 1;
      letter-spacing: 0.06em;
      color: #efe7d4;            /* ivory / marble */
      white-space: nowrap;
    }

    /* "N", "T" and "k": one shared height, a little below the full capitals.
       Cinzel draws the lowercase k as a small capital, so it is enlarged
       until it stands exactly as tall as the N and T. */
    .name .nt { font-size: 0.92em; }
    .name .k  { font-size: 1.085em; }

    /* the "c": reduced size, on the baseline */
    .name .c {
      font-size: 0.8em;
    }

    /* the "e": a true lowercase e (Cinzel has none, so it comes from
       Cormorant Garamond Bold), sized to stand exactly as tall as the "c" */
    .name .e {
      font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif;
      font-weight: 700;
      font-size: 1.24em;
      letter-spacing: 0.03em;
    }

    /* the "u": a little smaller and lifted, so the "u" plus its line together
       fill the same height as the letters beside it. The line is the letter's
       own underline, raised so it rests exactly on the shared baseline. */
    .name .u {
      position: relative;
      top: -0.145em;             /* = underline offset + thickness */
      font-size: 0.8em;
      letter-spacing: 0;         /* keeps the line exactly as wide as the u */
      text-decoration: underline;
      text-decoration-thickness: 0.055em;
      text-underline-offset: 0.09em;
    }

    /* Line 2: one line, classical Garamond, sized to always fit the width */
    .tagline {
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(1rem, min(4.4vh, 4.6vw), 2.8rem);
      line-height: 1.3;
      letter-spacing: 0.02em;
      white-space: nowrap;
      color: #a8d2f2;            /* light blue */
    }

    /* Row of record photos under the text (static) */
    .records {
      display: flex;
      justify-content: center;
      gap: var(--gap);
      margin-top: 2vh;
      list-style: none;
    }

    .records li {
      width: var(--tile);
      aspect-ratio: 1 / 1;
      padding: 0.3rem;
      border: 1px solid rgba(239, 231, 212, 0.55);   /* thin ivory frame */
    }

    .records img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;          /* crops each photo to a square, no stretching */
    }

    /* Drawings: one small strip under the LPs, just a hint.
       Same total width as the LP row; each drawing keeps its own shape. */
    .drawings {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: calc(var(--gap) / 2);
      width: calc(var(--cols) * var(--tile) + (var(--cols) - 1) * var(--gap));
      --dh: calc((var(--cols) * var(--tile) + (var(--cols) - 1) * var(--gap) - 8 * var(--gap) / 2) / 9.6);
    }

    .drawings li {
      height: var(--dh);
      padding: 2px;
      border: 1px solid rgba(239, 231, 212, 0.35);   /* fainter frame */
    }

    .drawings img {
      display: block;
      height: 100%;
      width: auto;
      opacity: 0.85;               /* a little quieter than the LPs */
    }

    /* phones: the middle 3 LPs, bigger; drawings wrap into short rows */
    @media (max-width: 600px) {
      :root { --tile: 27vw; --cols: 3; }
      .records li:first-child,
      .records li:last-child { display: none; }
      .drawings { --dh: 17vw; }
    }
  </style>
</head>
<body>
  <h1 class="name" aria-label="eNTckidu"><span class="e">e</span><span class="nt">NT</span><span class="c">c</span><span class="k">k</span>id<span class="u">u</span></h1>
  <p class="tagline">music, drawings, laziness.</p>
  <ul class="records">
        <li><img src="jane-here-we-are.jpg" alt="Jane – Here We Are" width="600" height="600"></li>
    <li><img src="thin-lizzy-chinatown.jpg" alt="Thin Lizzy – Chinatown" width="600" height="600"></li>
    <li><img src="king-crimson-lizard.jpg" alt="King Crimson – Lizard" width="600" height="600"></li>
    <li><img src="talking-heads-naked.jpg" alt="Talking Heads – Naked" width="600" height="600"></li>
    <li><img src="experimental.jpg" alt="Experimental" width="600" height="600"></li>
  </ul>
  <script>
  /* Shows a random 5 of the records on every visit or refresh.
     To add a record: upload its photo next to index.html and add a line below. */
  var records = [
    ["jane-here-we-are.jpg", "Jane – Here We Are"],
    ["thin-lizzy-chinatown.jpg", "Thin Lizzy – Chinatown"],
    ["king-crimson-lizard.jpg", "King Crimson – Lizard"],
    ["talking-heads-naked.jpg", "Talking Heads – Naked"],
    ["experimental.jpg", "Experimental"],
    ["lp-guru-guru.jpg", "Guru Guru – This Is Guru Guru"],
    ["lp-kenny-rogers.jpg", "Kenny Rogers – We've Got Tonight"],
    ["lp-yusuf.jpg", "Yusuf – An Other Cup"],
    ["lp-gong-magick-brother.jpg", "Gong – Magick Brother"],
    ["lp-celelalte-cuvinte-stem.jpg", "Celelalte Cuvinte – .STEM"],
    ["lp-gunesh.jpg", "Gunesh"],
    ["lp-kebnekajse.jpg", "Kebnekajse – Resa mot okänt mål"],
    ["lp-moving-gelatine-plates.jpg", "Moving Gelatine Plates – The World of Genius Hans"],
    ["lp-catapilla-changes.jpg", "Catapilla – Changes"],
    ["lp-soft-machine.jpg", "Soft Machine – Softs"],
    ["lp-rush-roll-the-bones.jpg", "Rush – Roll the Bones"],
    ["lp-omega.jpg", "Omega"],
    ["lp-partizan.jpg", "Partizan – Am cu ce"],
    ["lp-van-der-graaf-godbluff.jpg", "Van der Graaf Generator – Godbluff"],
    ["lp-mark-almond-ii.jpg", "Mark-Almond II"],
    ["lp-gentle-giant-free-hand.jpg", "Gentle Giant – Free Hand"],
    ["lp-jurgen-pluta-blanche.jpg", "Jürgen Pluta – Blanche"],
    ["lp-formatii-rock-4.jpg", "Formații rock 4"],
    ["lp-can-tago-mago.jpg", "Can – Tago Mago"],
    ["lp-genesis-the-lamb.jpg", "Genesis – The Lamb Lies Down on Broadway"],
    ["lp-genesis-trick-of-the-tail.jpg", "Genesis – A Trick of the Tail"],
    ["lp-twisted-sister-come-out-and-play.jpg", "Twisted Sister – Come Out and Play"],
    ["lp-frank-zappa-tinseltown-rebellion.jpg", "Frank Zappa – Tinseltown Rebellion"],
    ["lp-branduardi-cercando-loro.jpg", "Branduardi – Cercando l'oro"],
    ["lp-celelalte-cuvinte-se-lasa-rau.jpg", "Celelalte Cuvinte – Se lasă rău"],
    ["lp-michael-rother-flammende-herzen.jpg", "Michael Rother – Flammende Herzen"],
    ["lp-thin-lizzy-black-rose.jpg", "Thin Lizzy – Black Rose"],
    ["lp-jane-lady.jpg", "Jane – Lady"],
    ["lp-eroc-3.jpg", "Eroc – Eroc 3"],
    ["lp-jethro-tull-curious-ruminant.jpg", "Jethro Tull – Curious Ruminant"],
    ["lp-harper-page-jugula.jpg", "Roy Harper & Jimmy Page – Whatever Happened to Jugula?"],
    ["lp-edgar-froese-aqua.jpg", "Edgar Froese – Aqua"],
    ["lp-khan-space-shanty.jpg", "Khan – Space Shanty"],
    ["lp-jaco-pastorius.jpg", "Jaco Pastorius – Jaco Pastorius"],
    ["lp-moody-blues-question-of-balance.jpg", "The Moody Blues – A Question of Balance"],
    ["lp-bachelor-of-hearts-on-the-boulevard.jpg", "Bachelor of Hearts – On the Boulevard"],
    ["lp-supersister-to-the-highest-bidder.jpg", "Supersister – To the Highest Bidder"],
    ["lp-freddie-mercury-mr-bad-guy.jpg", "Freddie Mercury – Mr. Bad Guy"]
  ];

  (function () {
    var last = [];
    try { last = JSON.parse(localStorage.getItem("lastRecords") || "[]"); } catch (e) {}

    // shuffle a copy, then prefer records that were not shown last time
    var pool = records.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    pool.sort(function (a, b) {
      return (last.indexOf(a[0]) >= 0) - (last.indexOf(b[0]) >= 0);
    });

    var imgs = document.querySelectorAll(".records img");
    var shown = [];
    for (var k = 0; k < imgs.length && k < pool.length; k++) {
      imgs[k].src = pool[k][0];
      imgs[k].alt = pool[k][1];
      shown.push(pool[k][0]);
    }
    try { localStorage.setItem("lastRecords", JSON.stringify(shown)); } catch (e) {}
  })();
  </script>
  <ul class="drawings">
    <li><img src="drawing-face.jpg" alt="Drawing: portrait of a man"></li>
    <li class="wide"><img src="drawing-bassist.jpg" alt="Drawing: bass player in sunglasses"></li>
    <li><img src="drawing-celelalte-cuvinte.jpg" alt="Drawing: Celelalte Cuvinte"></li>
    <li><img src="drawing-harmonica.jpg" alt="Drawing: musician in profile"></li>
    <li><img src="drawing-beard.jpg" alt="Drawing: bearded man"></li>
    <li class="wide"><img src="drawing-pianist.jpg" alt="Drawing: musician at the keys"></li>
    <li class="wide"><img src="drawing-wild-hair.jpg" alt="Drawing: head with wild hair"></li>
    <li><img src="drawing-long-hair.jpg" alt="Drawing: long-haired face"></li>
    <li><img src="drawing-guitar-man.jpg" alt="Drawing: man with guitar"></li>
  </ul>
</body>
</html>
