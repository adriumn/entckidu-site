<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eNTckidu</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1d45'/%3E%3Ctext x='32' y='49' text-anchor='middle' font-family='Cormorant Garamond,Garamond,Georgia,serif' font-weight='700' font-size='70' fill='%23efe7d4'%3Ee%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;800&family=Cormorant+Garamond:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* shared sizes: the LP row and the drawings mosaic use the same grid */
    :root {
      --tile: clamp(6.5rem, min(17vw, 25vh), 14rem);   /* one LP square (bigger) */
      --gap: clamp(0.6rem, 1.6vw, 1.5rem);
      --cols: 5;
    }

    html { background: #06122d; }   /* shows only while the wall picture loads */

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;   /* content starts near the top */
      gap: 4vh;
      padding: calc(3.2rem + 6vh) 6vw 8vh;   /* room for the header bar */
      text-align: center;
      color: #efe7d4;
    }

    /* ---- v0.4: the wall - every cover, dimmed, behind everything (images/wall.jpg) ---- */
    :root { --mt: 104px; }                     /* one cover in the wall */
    .wall {
      position: fixed; inset: 0; z-index: -2;
      background: 0 0 / calc(15 * var(--mt)) auto repeat;   /* v0.6: picture set by the shuffle script */
      opacity: 0; transition: opacity 0.6s;
      filter: saturate(0.9) brightness(0.78);
    }
    .wall.ready { opacity: 1; }
    /* v0.6: a cover fading into a new one, sitting on top of its cell until the fade ends */
    .wall-swap { position: absolute; width: var(--mt); height: var(--mt);
      background-size: 100% 100%; opacity: 0; transition: opacity 1.6s ease-in-out; }
    /* blue veil: keeps a little of the old blue and darkens the spot behind the name */
    .veil {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 40% 22% at 50% 24%, rgba(6,18,45,0.8) 0%, rgba(6,18,45,0.4) 65%, rgba(6,18,45,0) 100%),
        linear-gradient(rgba(11,29,69,0.22), rgba(11,29,69,0.22));
    }
    .name { text-shadow: 0 2px 18px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.6); }

    /* ---- v0.4: header bar ---- */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      height: 3.2rem; display: flex; align-items: center; justify-content: center;
      gap: clamp(0.3rem, 2vw, 1.5rem);
      background: #000; border-bottom: 2px solid #5fb36a;      /* thin green line */
    }
    .topbar a {
      font-family: "EB Garamond", Garamond, serif; font-size: 1.4rem; font-weight: 500; letter-spacing: 0.07em;
      color: #e6dcc4; text-decoration: none;
      /* v0.9.2: each link is a full-height box; the page you are on gets a green box */
      align-self: stretch; display: flex; align-items: center; padding: 0 clamp(0.8rem, 2.4vw, 1.6rem);
      transition: background 0.2s, color 0.2s;
    }
    .topbar a:hover { background: #1c2a1e; color: #fff; }
    .topbar a[aria-current="page"] { background: #5fb36a; color: #07140a; }
    /* v0.9.8: "music" opens a small menu - covers / list of albums */
    .topbar .menu { position: relative; align-self: stretch; display: flex; }
    .topbar .menu.here > a { background: #5fb36a; color: #07140a; }
    .topbar .sub {
      display: none; position: absolute; top: calc(100% + 2px); left: 0; min-width: 14rem;
      flex-direction: column; background: #000; border: 1px solid #5fb36a; border-top: 0;
      box-shadow: 0 10px 28px rgba(0,0,0,0.6);
    }
    .topbar .menu:hover .sub, .topbar .menu:focus-within .sub, .topbar .menu.open .sub { display: flex; }
    .topbar .sub a { height: 3rem; font-size: 1.25rem; white-space: nowrap; padding: 0 1.2rem;
      border-top: 1px solid rgba(239,231,212,0.15); }
    .topbar .sub a:first-child { border-top: 0; }
    .topbar .sub a[aria-current="page"] { background: none; color: #6fc47a; }
    .topbar .sub a[aria-current="page"]::after { content: "•"; margin-left: auto; padding-left: 1rem; }
    .version {
      position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%);
      font-family: "Cinzel", serif; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.12em; color: #6fc47a;
    }
    .version span {
      margin-left: 0.6rem; font-family: "EB Garamond", serif; font-weight: 400; font-size: 1rem;
      letter-spacing: 0.04em; color: rgba(239,231,212,0.75);
    }

    /* ---- v0.4: one cover in the wall lights up, level with the name ---- */
    ul.records { position: fixed; z-index: 2; margin: 0; display: block; gap: 0; }
    ul.records li { width: var(--mt); height: var(--mt); padding: 0; border: 0;
      outline: 2px solid rgba(239,231,212,0.9); outline-offset: 2px;
      box-shadow: 0 0 2.5rem rgba(168,210,242,0.55), 0 0.8rem 2rem rgba(0,0,0,0.6);
      transform: scale(1.12); }
    ul.records .tag {
      position: absolute; left: 50%; top: calc(100% + 0.6rem); transform: translateX(-50%) scale(0.893);
      width: calc(var(--mt) * 2.2); text-align: center;
      font-family: "EB Garamond", serif; font-style: italic; font-size: 0.95rem; line-height: 1.25; color: #bfe0f8;
      background: rgba(6,18,45,0.82); padding: 0.3rem 0.5rem; border-radius: 0.3rem;
    }
    /* v0.5: any cover in the wall can be clicked; a soft glow shows which one */
    .wall-hover {
      position: fixed; z-index: 1; width: var(--mt); height: var(--mt); pointer-events: none;
      outline: 2px solid rgba(239,231,212,0.7); box-shadow: 0 0 1.6rem rgba(168,210,242,0.5);
      background: rgba(255,255,255,0.06); display: none;
    }
    body.on-wall { cursor: zoom-in; }
    ul.records .tag b { display: block; font-family: "Cinzel", serif; font-style: normal; font-weight: 800;
      color: #fff8e8; letter-spacing: 0.05em; }

    /* Line 1: the name */
    .name {
      font-family: "Cinzel", "Trajan Pro", "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(2.25rem, 10.5vw, 8.25rem);   /* a quarter smaller than before */
      line-height: 1;
      letter-spacing: 0.06em;
      color: #efe7d4;            /* ivory / marble */
      white-space: nowrap;
    }

    /* "N", "T" and "k": one shared height, a little below the full capitals.
       Cinzel draws the lowercase k as a small capital, so it is enlarged
       until it stands exactly as tall as the N and T. */
    .name .nt { font-size: 0.92em; }
    .name .k  { font-size: 1.085em; }

    /* the "c": reduced size, on the baseline */
    .name .c {
      font-size: 0.8em;
    }

    /* the "e": a true lowercase e (Cinzel has none, so it comes from
       Cormorant Garamond Bold), sized to stand exactly as tall as the "c" */
    .name .e {
      font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif;
      font-weight: 700;
      font-size: 1.24em;
      letter-spacing: 0.03em;
    }

    /* the "u": a little smaller and lifted, so the "u" plus its line together
       fill the same height as the letters beside it. The line is the letter's
       own underline, raised so it rests exactly on the shared baseline. */
    .name .u {
      position: relative;
      top: -0.145em;             /* = underline offset + thickness */
      font-size: 0.8em;
      letter-spacing: 0;         /* keeps the line exactly as wide as the u */
      text-decoration: underline;
      text-decoration-thickness: 0.055em;
      text-underline-offset: 0.09em;
    }

    /* v0.7.1: the tagline, one classic line of text under the name */
    .tagline-under {
      margin-top: calc(-4vh - 0.15em); text-align: center;   /* tucked close under the name */
      position: relative; z-index: 3; white-space: nowrap;   /* always one line: keep the text short */
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-style: normal; font-weight: 400; font-size: clamp(0.84rem, 2.89vw, 2.58rem); line-height: 1.2;
      letter-spacing: 0.04em; color: #bfe0f8;
      text-shadow: 0 2px 14px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);
    }
    .tagline-under:empty { display: none; }

    /* Line 2: one line, classical Garamond, sized to always fit the width */
    .tagline {
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(1rem, min(4.4vh, 4.6vw), 2.8rem);
      line-height: 1.3;
      letter-spacing: 0.02em;
      white-space: nowrap;
      color: #a8d2f2;            /* light blue */
    }

    /* Row of record photos under the text (static) */
    .records {
      display: flex;
      justify-content: center;
      gap: var(--gap);
      margin-top: 2vh;
      list-style: none;
    }

    .records li {
      width: var(--tile);
      aspect-ratio: 1 / 1;
      padding: 0.3rem;
      border: 1px solid rgba(239, 231, 212, 0.55);   /* thin ivory frame */
    }

    .records img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;          /* crops each photo to a square, no stretching */
    }

    /* Drawings: a strip of sketchbook paper under the LPs, so they read as
       their own thing and not as more records. The paper fits closely around
       the drawings; each drawing keeps its own shape. */
    .drawings {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: calc(var(--gap) / 2);
      margin-top: 9vh;                       /* air between the name and the drawings */
      /* the paper hugs the drawings: a thin even border all round */
      --row-w: calc(var(--cols) * var(--tile) + (var(--cols) - 1) * var(--gap));
      padding: calc(var(--gap) * 0.6);
      width: fit-content;
      max-width: var(--row-w);
      /* dark yellow-brown drawing paper, faint pencil sketches on top (images/paper-sketch.svg) */
      background: #d9c79c url("images/paper-sketch.svg") center / cover;   /* lighter paper (v0.4) */
      box-shadow: 0 0.8rem 2.2rem rgba(0, 0, 0, 0.45);
      /* drawing height: all 9 on one line, a little inside the LP row */
      --dh: calc((var(--row-w) - 4.4 * var(--gap) - 8 * var(--gap) / 2) / 9.6);
    }

    .drawings li {
      height: var(--dh);
      box-shadow: 0 1px 3px rgba(60, 40, 20, 0.35);   /* like sheets lying on the paper */
    }

    .drawings a { display: block; height: 100%; }   /* v0.9: each drawing opens the drawings page */
    .drawings li { transition: transform 0.2s ease; }
    .drawings li:hover { transform: translateY(-3px) rotate(-0.8deg); }
    .drawings img {
      display: block;
      height: 100%;
      width: auto;
    }

    /* phones: the middle 3 LPs, bigger; drawings wrap into short rows */
    @media (max-width: 600px) {
      :root { --tile: 27vw; --cols: 3; }
      ul.records, .version { display: none !important; }
      .drawings { --dh: 17vw; }
    }

    /* records can be clicked to see them big */
    .records img { cursor: zoom-in; }
    .records img:focus-visible { outline: 2px solid #a8d2f2; outline-offset: 3px; }

    /* the enlarged view: cover in the middle, artist and album underneath */
    .zoom {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1.4rem;
      padding: 5vh 6vw;
      overflow-y: auto;                 /* scrolls when the details make it taller than the screen */
      background: rgba(4, 11, 28, 0.97);   /* a bit darker so the details text reads well */
      cursor: zoom-out;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s;
    }
    .zoom.open { opacity: 1; visibility: visible; }

    .zoom img {
      display: block;
      width: min(480px, 86vw, 62vh);   /* photos are 480 px, so they stay sharp */
      aspect-ratio: 1 / 1;
      object-fit: cover;
      padding: 0.4rem;
      border: 1px solid rgba(239, 231, 212, 0.55);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.6);
      transform: scale(0.94);
      transition: transform 0.25s ease;
      margin-top: auto;                 /* with the margin below: centred when it fits */
      flex-shrink: 0;
    }
    .zoom.open img { transform: scale(1); }

    .zoom .artist {
      font-family: "Cinzel", "Trajan Pro", "Times New Roman", serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 4.4vw, 2.7rem);
      letter-spacing: 0.08em;
      line-height: 1.15;
      color: #fff8e8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }
    .zoom .album {
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.3rem, 3.4vw, 2rem);
      line-height: 1.25;
      margin-top: 0.4rem;
      color: #bfe0f8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* album details from MusicBrainz, filled in after the enlarged view opens */
    .zoom .details {
      max-width: min(40rem, 88vw);
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      line-height: 1.45;
      color: rgba(239, 231, 212, 0.85);
      cursor: default;
      margin-bottom: auto;
    }
    .zoom .details > * + * { margin-top: 0.7rem; }
    .zoom .details .loading { font-style: italic; color: rgba(168, 210, 242, 0.7); }
    .zoom .details .meta {
      font-family: "Cinzel", "Trajan Pro", "Times New Roman", serif;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #a8d2f2;
    }
    .zoom .details .genres { font-style: italic; color: #bfe0f8; }
    .zoom .details .members span { white-space: nowrap; }
    .zoom .details .members i { color: rgba(239, 231, 212, 0.6); }
    .zoom .details ol {
      list-style: none;
      columns: 2 14rem;
      column-gap: 2rem;
      text-align: left;
      font-size: 0.95em;
    }
    .zoom .details li { break-inside: avoid; display: flex; gap: 0.6rem; }
    .zoom .details li .n { min-width: 1.8em; color: rgba(168, 210, 242, 0.7); }
    .zoom .details li .t { flex: 1; }
    .zoom .details li .l { color: rgba(239, 231, 212, 0.55); font-variant-numeric: tabular-nums; }
    .zoom .details .source { font-size: 0.85em; }
    .zoom .details a { color: rgba(168, 210, 242, 0.8); }
  </style>

  <h1 class="name" aria-label="eNTckidu"><span class="e">e</span><span class="nt">NT</span><span class="c">c</span><span class="k">k</span>id<span class="u">u</span></h1>
  <p class="tagline-under"></p>
  <ul class="records">
    <li><img src="" alt="" width="480" height="480"></li>
  </ul>
  <script src="images/wall.js"></script>
  <script>
  /* v0.6: a new wall on every visit.
     images/wall.jpg holds every cover once (see tools/make-wall.py). Here the covers
     are dealt into a new random order, drawn into a canvas, and that becomes the
     wall. Every SWAP_EVERY seconds one cover on screen fades into another one.
     WALL.cells is updated, so clicking a cover still opens the right record. */
  var SWAP_EVERY = 7;        // seconds between two covers changing; 0 = never
  (function () {
    var wall = document.querySelector(".wall");
    var sprite = WALL.cells.slice();          // where each cover sits inside wall.jpg
    var at = {};                              // file -> its place in wall.jpg
    sprite.forEach(function (f, k) { if (!(f in at)) at[f] = k; });
    var files = Object.keys(at);

    // shuffle (Fisher-Yates); the featured cover and the clicks read WALL.cells after this
    var cells = sprite.slice();
    for (var i = cells.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = cells[i]; cells[i] = cells[j]; cells[j] = t;
    }
    WALL.cells = cells;

    var pic = new Image(), canvas, ctx, px, url = null;
    function tile(f, k) {                     // copy cover f from wall.jpg into cell k of the canvas
      var s = at[f];
      ctx.drawImage(pic, (s % WALL.cols) * px, Math.floor(s / WALL.cols) * px, px, px,
                    (k % WALL.cols) * px, Math.floor(k / WALL.cols) * px, px, px);
    }
    function publish(done) {                  // the canvas becomes the wall's background
      canvas.toBlob(function (blob) {
        var next = URL.createObjectURL(blob), probe = new Image();
        probe.onload = function () {          // decoded first, so the wall never blinks
          wall.style.backgroundImage = 'url("' + next + '")';
          if (url) URL.revokeObjectURL(url);
          url = next;
          wall.classList.add("ready");
          if (done) done();
        };
        probe.src = next;
      }, "image/jpeg", 0.9);
    }
    function fallback() {                     // no canvas (very old browser): the plain wall
      WALL.cells = sprite;
      wall.style.backgroundImage = 'url("images/wall.jpg")';
      wall.classList.add("ready");
    }

    pic.onload = function () {
      try {
        px = pic.naturalWidth / WALL.cols;
        canvas = document.createElement("canvas");
        canvas.width = pic.naturalWidth; canvas.height = WALL.rows * px;
        ctx = canvas.getContext("2d");
        WALL.cells.forEach(tile);
        publish(startSwaps);
      } catch (e) { fallback(); }
    };
    pic.onerror = fallback;
    pic.src = "images/wall.jpg";

    function startSwaps() {
      if (!SWAP_EVERY || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
      setInterval(swap, SWAP_EVERY * 1000);
    }
    function onScreen() {                     // cells visible right now: {k, left, top}
      var mt = WALL.tile, off = parseFloat(wall.style.backgroundPositionY) || 0, out = [];
      for (var r = Math.floor(-off / mt); r * mt + off < innerHeight; r++)
        for (var c = 0; c * mt < innerWidth; c++) {
          var k = (((r % WALL.rows) + WALL.rows) % WALL.rows) * WALL.cols + (c % WALL.cols);
          out.push({ k: k, left: c * mt, top: r * mt + off });
        }
      return out;
    }
    var busy = false;
    function swap() {
      if (busy || document.hidden || document.querySelector(".zoom.open")) return;
      var vis = onScreen().filter(function (v) { return v.k !== window.featuredCell; });
      if (!vis.length) return;
      var shown = {};
      vis.forEach(function (v) { shown[WALL.cells[v.k]] = true; });
      var pick = vis[Math.floor(Math.random() * vis.length)], f = null;
      for (var n = 0; n < 30 && !f; n++) {    // a cover that is not on screen already
        var g = files[Math.floor(Math.random() * files.length)];
        if (!shown[g]) f = g;
      }
      if (!f) return;
      busy = true;
      // the new cover, alone, fades in over the old one
      var one = document.createElement("canvas"); one.width = one.height = px;
      var s = at[f];
      one.getContext("2d").drawImage(pic, (s % WALL.cols) * px, Math.floor(s / WALL.cols) * px, px, px, 0, 0, px, px);
      var cover = document.createElement("div");
      cover.className = "wall-swap";
      cover.style.left = pick.left + "px"; cover.style.top = pick.top + "px";
      cover.style.backgroundImage = 'url("' + one.toDataURL("image/jpeg", 0.9) + '")';
      wall.appendChild(cover);
      WALL.cells[pick.k] = f;                 // clicks see the new cover straight away
      requestAnimationFrame(function () { requestAnimationFrame(function () { cover.style.opacity = 1; }); });
      setTimeout(function () {                // fade done: paint it into the wall for good
        tile(f, pick.k);
        publish(function () { cover.remove(); busy = false; });
      }, 1700);
    }
  })();
  </script>
  <script>
  /* FEATURED: the cover that lights up next to the name.
     Put a file name from the list below, or "" to pick one at random. */
  var FEATURED = "";

  /* TAGLINE: one small line of text under the name. Leave it "" to show nothing. */
  var TAGLINE = "who you jivin' with that cosmic debris?";
  document.querySelector(".tagline-under").textContent = TAGLINE;

  /* The records list. To add a record: put its photo in images/records/,
     add a line below, then rebuild the wall: python tools/make-wall.py
     To add a record: put its photo in images/records/ and add a line below:
       ["file.jpg", "Band – Album"]
     Optional third value: the MusicBrainz release ID, when the automatic
     lookup picks the wrong album or the entry has no album name:
       ["file.jpg", "Band – Album", "b6d2e0f8-...."] */
  var RECORDS_DIR = "images/records/";
  var records = [
    ["jane-here-we-are.jpg", "Jane – Here We Are"],
    ["thin-lizzy-chinatown.jpg", "Thin Lizzy – Chinatown"],
    ["king-crimson-lizard.jpg", "King Crimson – Lizard"],
    ["talking-heads-naked.jpg", "Talking Heads – Naked"],
    ["experimental.jpg", "Experimental"],
    ["lp-guru-guru.jpg", "Guru Guru – This Is Guru Guru"],
    ["lp-kenny-rogers.jpg", "Kenny Rogers – We've Got Tonight"],
    ["lp-yusuf.jpg", "Yusuf – An Other Cup"],
    ["lp-gong-magick-brother.jpg", "Gong – Magick Brother"],
    ["lp-celelalte-cuvinte-stem.jpg", "Celelalte Cuvinte – .STEM"],
    ["lp-gunesh.jpg", "Gunesh"],
    ["lp-kebnekajse.jpg", "Kebnekajse – Resa mot okänt mål"],
    ["lp-moving-gelatine-plates.jpg", "Moving Gelatine Plates – The World of Genius Hans"],

  /* NOT_FEATURED: covers that stay in the wall but are never picked as the big
     featured cover next to the name. Add or remove file names freely. */
  var NOT_FEATURED = [
    "lp-led-zeppelin-houses-of-the-holy.jpg", "lp-wallenstein-charline.jpg",
    "lp-flairck-the-ladys-back.jpg", "cd-guru-guru-hinten.jpg",
    "lp-black-sabbath-sabbath-bloody-sabbath.jpg"
  ];

  (function () {
    var li = document.querySelector(".records li"), img = li.querySelector("img");
    var tag = document.createElement("p"); tag.className = "tag"; li.appendChild(tag);
    var wall = document.querySelector(".wall"), name = document.querySelector(".name");
    var chosen = null;      // the wall column picked on this visit, kept when the window is resized

    function find(file) {
      for (var i = 0; i < records.length; i++) if (records[i][0] === file) return records[i];
      return null;
    }

    function place() {
      var mt = WALL.tile, n = name.getBoundingClientRect();
      // slide the wall so one row of covers is centred on the name
      var mid = n.top + n.height / 2, off = ((mid - mt / 2) % mt + mt) % mt;
      wall.style.backgroundPositionY = off + "px";
      var r = Math.round((mid - mt / 2 - off) / mt);
      // a column beside the name, left or right
      var cols = Math.floor(innerWidth / mt), choices = [];
      for (var c = 1; c <= Math.floor(n.left / mt) - 1; c++) choices.push(c);
      for (c = Math.ceil(n.right / mt); c < cols - 1; c++) choices.push(c);
      var ok = choices.filter(function (c) {          // v0.6: skip covers in NOT_FEATURED
        return NOT_FEATURED.indexOf(WALL.cells[(r % WALL.rows) * WALL.cols + (c % WALL.cols)]) < 0;
      });
      if (ok.length) choices = ok;
      if (!choices.length) { li.parentNode.style.display = "none"; return; }
      li.parentNode.style.display = "";
      if (chosen === null || choices.indexOf(chosen) < 0)
        chosen = choices[Math.floor(Math.random() * choices.length)];
      var rec = (FEATURED && find(FEATURED)) ||
                find(WALL.cells[(r % WALL.rows) * WALL.cols + (chosen % WALL.cols)]) || records[0];
      var ul = li.parentNode;
      window.featuredCell = (r % WALL.rows) * WALL.cols + (chosen % WALL.cols);   // the swapper leaves it alone
      ul.style.left = chosen * mt + "px";
      ul.style.top = (r * mt + off) + "px";
      if (img.alt !== rec[1]) {
        img.src = RECORDS_DIR + rec[0];
        img.alt = rec[1];
        img.dataset.mbid = rec[2] || "";
        var p = rec[1].split(" \u2013 ");
        tag.textContent = "";
        var b = document.createElement("b"); b.textContent = p[0]; tag.appendChild(b);
        if (p[1]) tag.appendChild(document.createTextNode(p.slice(1).join(" \u2013 ")));
      }
    }

    place();
    if (document.fonts) document.fonts.ready.then(place);   // the name changes size when its font arrives
    addEventListener("resize", place);
  })();
  </script>

  <!-- enlarged record: opens when a record is clicked -->
  <div class="zoom" role="dialog" aria-modal="true" aria-label="Record" aria-hidden="true">
    <img src="" alt="">
    <div>
      <p class="artist"></p>
      <p class="album"></p>
    </div>
    <div class="details" aria-live="polite"></div>
  </div>
  <script>
  /* Click a record to see it big, with the artist and album underneath.
     The names come from the records list ("Band – Album").
     Click anywhere or press Esc to close. */
  (function () {
    var zoom = document.querySelector(".zoom");
    var big = zoom.querySelector("img");
    var artist = zoom.querySelector(".artist");
    var album = zoom.querySelector(".album");
    var opener = null;

    function open(img) {
      var parts = img.alt.split(" – ");
      big.src = img.src;
      big.alt = img.alt;
      artist.textContent = parts[0];
      album.textContent = parts.slice(1).join(" – ");   // empty if there is no album name
      album.style.display = parts.length > 1 ? "" : "none";
      opener = img;
      zoom.classList.add("open");
      zoom.setAttribute("aria-hidden", "false");
      zoom.scrollTop = 0;
      loadDetails(parts[0], parts.slice(1).join(" – "), img.dataset.mbid);
    }

    /* ---- album details: asks our Azure Function (/api/album), which asks MusicBrainz ---- */
    var details = zoom.querySelector(".details");
    var answers = {};     // remembered for this visit: the same record opens instantly the second time
    var current = 0;      // which opening the panel belongs to, so a late answer never lands on another record

    function loadDetails(artistName, albumName, mbid) {
      var mine = ++current;
      details.textContent = "";
      var url;
      if (mbid) url = "/api/album?mbid=" + encodeURIComponent(mbid);
      else if (albumName) url = "/api/album?artist=" + encodeURIComponent(artistName) + "&album=" + encodeURIComponent(albumName);
      else return;        // no album name and no ID: nothing to look up

      var loading = add(details, "p", "loading", "looking up details…");

      if (!answers[url]) {
        var ctrl = window.AbortController ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 20000);
        answers[url] = fetch(url, ctrl ? { signal: ctrl.signal } : {})
          .then(function (res) { return res.ok ? res.json() : null; })
          .catch(function () { return null; })
          .then(function (data) {
            clearTimeout(timer);
            if (!data) delete answers[url];   // a failure may be temporary: try again next time
            return data;
          });
      }
      answers[url].then(function (data) {
        if (mine !== current) return;         // the visitor has moved on
        details.textContent = "";
        if (data) show(data);
      });
    }

    function show(d) {
      var meta = [d.year, d.label, d.country, d.format].filter(Boolean);
      if (meta.length) add(details, "p", "meta", meta.join(" · "));
      if (d.genres && d.genres.length) add(details, "p", "genres", d.genres.join(", "));

      if (d.members && d.members.length) {
        var m = add(details, "p", "members");
        d.members.forEach(function (x, i) {
          if (i) m.appendChild(document.createTextNode(" · "));
          var s = add(m, "span", "", x.name);
          var extra = [x.roles, x.years].filter(Boolean).join(", ");
          if (extra) { s.appendChild(document.createTextNode(" ")); add(s, "i", "", extra); }
        });
      }

      if (d.tracks && d.tracks.length) {
        var ol = add(details, "ol");
        d.tracks.forEach(function (t) {
          var li = add(ol, "li");
          add(li, "span", "n", t.number);
          add(li, "span", "t", t.title);
          if (t.length) add(li, "span", "l", t.length);
        });
      }

      var src = add(details, "p", "source");
      var a = add(src, "a", "", "details from MusicBrainz");
      a.href = d.musicBrainzUrl;
      a.target = "_blank";
      a.rel = "noopener";
      a.addEventListener("click", function (e) { e.stopPropagation(); });   // open the link, keep the view
    }

    // makes an element with text (never HTML, so odd names can't break the page)
    function add(parent, tag, cls, text) {
      var el = document.createElement(tag);
      if (cls) el.className = cls;
      if (text != null) el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    function close() {
      current++;
      zoom.classList.remove("open");
      zoom.setAttribute("aria-hidden", "true");
      if (opener) opener.focus();
    }

    document.querySelectorAll(".records img").forEach(function (img) {
      img.tabIndex = 0;
      img.addEventListener("click", function () { open(img); });
      img.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(img); }
      });
    });

    window.openRecord = open;      // used by the wall (v0.5)
    zoom.addEventListener("click", close);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && zoom.classList.contains("open")) close();
    });
  })();
  </script>
  <script>
  /* v0.5: click any cover in the background wall to see it big, with its details.
     WALL (images/wall.js) says which photo sits in which cell. */
  (function () {
    var wall = document.querySelector(".wall");
    var glow = document.createElement("div"); glow.className = "wall-hover"; document.body.appendChild(glow);

    function onWall(e) {           // true when the pointer is on bare background, not on the name, drawings or header
      return e.target === document.body || e.target === document.documentElement;
    }
    function cellAt(x, y) {
      var mt = WALL.tile, off = parseFloat(wall.style.backgroundPositionY) || 0;
      var c = Math.floor(x / mt), r = Math.floor((y - off) / mt);
      var file = WALL.cells[(((r % WALL.rows) + WALL.rows) % WALL.rows) * WALL.cols + (c % WALL.cols)];
      for (var i = 0; i < records.length; i++)
        if (records[i][0] === file) return { rec: records[i], left: c * mt, top: r * mt + off };
      return null;
    }

    document.addEventListener("mousemove", function (e) {
      var cell = onWall(e) && cellAt(e.clientX, e.clientY);
      document.body.classList.toggle("on-wall", !!cell);
      glow.style.display = cell ? "block" : "none";
      if (cell) { glow.style.left = cell.left + "px"; glow.style.top = cell.top + "px"; }
    });
    document.addEventListener("mouseleave", function () { glow.style.display = "none"; });

    document.addEventListener("click", function (e) {
      if (!onWall(e)) return;
      var cell = cellAt(e.clientX, e.clientY);
      if (!cell) return;
      var img = new Image();               // a stand-in for the clicked cover, for the big view
      img.src = RECORDS_DIR + cell.rec[0];
      img.alt = cell.rec[1];
      img.dataset.mbid = cell.rec[2] || "";
      glow.style.display = "none";
      window.openRecord(img);
    });
  })();
  </script>
  <script>
  /* v0.9.8: on touch screens the first tap on "music" opens its menu, the second follows the link */
  (function () {
    document.querySelectorAll(".topbar .menu").forEach(function (m) {
      m.querySelector("a").addEventListener("click", function (e) {
        if (window.matchMedia("(hover: none)").matches && !m.classList.contains("open")) {
          e.preventDefault(); m.classList.add("open");
        }
      });
      document.addEventListener("click", function (e) { if (!m.contains(e.target)) m.classList.remove("open"); });
    });
  })();
  </script>
