<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eNTckidu · drawings</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1d45'/%3E%3Ctext x='32' y='49' text-anchor='middle' font-family='Cormorant Garamond,Garamond,Georgia,serif' font-weight='700' font-size='70' fill='%23efe7d4'%3Ee%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #06122d; }
    body {
      min-height: 100vh;
      padding: calc(3.2rem + 4vh) 5vw 8vh;      /* room for the header bar */
      color: #efe7d4; text-align: center;
      font-family: "EB Garamond", Garamond, Georgia, serif;
    }

    /* v0.9.3: the original deep blue of the site, no cover wall on this page */
    body { background: radial-gradient(ellipse 120% 70% at 50% 30%, #13306b 0%, #0b1d45 55%, #06122d 100%) fixed no-repeat; }

    /* header bar - same as index.html */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      height: 3.2rem; display: flex; align-items: center; justify-content: center;
      gap: clamp(0.3rem, 2vw, 1.5rem);
      background: #000; border-bottom: 2px solid #5fb36a;
    }
    .topbar a {
      font-family: "EB Garamond", Garamond, serif; font-size: 1.4rem; font-weight: 500; letter-spacing: 0.07em;
      color: #e6dcc4; text-decoration: none;
      /* v0.9.2: each link is a full-height box; the page you are on gets a green box */
      align-self: stretch; display: flex; align-items: center; padding: 0 clamp(0.8rem, 2.4vw, 1.6rem);
      transition: background 0.2s, color 0.2s;
    }
    .topbar a:hover { background: #1c2a1e; color: #fff; }
    .topbar a[aria-current="page"] { background: #5fb36a; color: #07140a; }
    /* v0.9.8: "music" opens a small menu - covers / list of albums */
    .topbar .menu { position: relative; align-self: stretch; display: flex; }
    .topbar .menu.here > a { background: #5fb36a; color: #07140a; }
    .topbar .sub {
      display: none; position: absolute; top: calc(100% + 2px); left: 0; min-width: 14rem;
      flex-direction: column; background: #000; border: 1px solid #5fb36a; border-top: 0;
      box-shadow: 0 10px 28px rgba(0,0,0,0.6);
    }
    .topbar .menu:hover .sub, .topbar .menu:focus-within .sub, .topbar .menu.open .sub { display: flex; }
    .topbar .sub a { height: 3rem; font-size: 1.25rem; white-space: nowrap; padding: 0 1.2rem;
      border-top: 1px solid rgba(239,231,212,0.15); }
    .topbar .sub a:first-child { border-top: 0; }
    .topbar .sub a[aria-current="page"] { background: none; color: #6fc47a; }
    .topbar .sub a[aria-current="page"]::after { content: "•"; margin-left: auto; padding-left: 1rem; }
    .version {
      position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%);
      font-family: "Cinzel", serif; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.12em; color: #6fc47a;
    }
    .version span {
      margin-left: 0.6rem; font-family: "EB Garamond", serif; font-weight: 400; font-size: 1rem;
      letter-spacing: 0.04em; color: rgba(239,231,212,0.75);
    }

    h1 {
      font-family: "Cinzel", serif; font-weight: 600; letter-spacing: 0.08em;
      font-size: clamp(2rem, 6vw, 4.2rem); line-height: 1;
      text-shadow: 0 2px 18px rgba(0,0,0,0.85);
    }
    .intro { margin: 0.8rem 0 4vh; font-size: clamp(1rem, 1.6vw, 1.3rem); color: #bfe0f8;
      text-shadow: 0 1px 8px rgba(0,0,0,0.9); }

    /* the drawings lie on a big sheet of sketchbook paper, in columns,
       each drawing keeps its own shape */
    .sheet {
      max-width: 1200px; margin: 0 auto;
      /* v0.9.1: no paper sheet here any more - the drawings lie straight on the dark wall */
      columns: 3 260px; column-gap: clamp(0.8rem, 2vw, 1.6rem);
    }
    .sheet button {
      display: block; width: 100%; margin: 0 0 clamp(0.8rem, 2vw, 1.6rem);
      break-inside: avoid; border: 0; padding: 0; background: none; cursor: zoom-in;
      box-shadow: 0 0.5rem 1.6rem rgba(0,0,0,0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .sheet button:hover { transform: rotate(-0.6deg) scale(1.02); box-shadow: 0 0.8rem 2.4rem rgba(0,0,0,0.75); }
    .sheet button:focus-visible { outline: 2px solid #efe7d4; outline-offset: 3px; }
    .sheet img { display: block; width: 100%; height: auto; }

    /* enlarged drawing */
    .big {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      padding: 4vh 4vw; background: rgba(4,11,28,0.96);
      opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s;
    }
    .big.open { opacity: 1; visibility: visible; }
    /* v0.9.1: the enlarged drawing lies on a sheet of the same sketchbook paper,
       with a wide margin all round, like a mount in a frame */
    .big .mat {
      --m: clamp(0.6rem, 1.75vw, 1.5rem);              /* the paper margin around the drawing */
      padding: var(--m);
      background: #d9c79c url("images/paper-sketch.svg") center / cover;
      box-shadow: 0 1.5rem 4rem rgba(0,0,0,0.75);
      transform: scale(0.95); transition: transform 0.25s ease;
    }
    .big.open .mat { transform: scale(1); }
    .big img {
      display: block; width: auto; height: auto;
      max-width: calc(86vw - 2 * var(--m)); max-height: calc(84vh - 2 * var(--m));
      box-shadow: 0 1px 4px rgba(60,40,20,0.45);   /* like a sheet lying on the paper */
      cursor: zoom-out;
    }
    .big p { font-size: 0.95rem; color: rgba(239,231,212,0.55); }   /* just "3 / 18" */
    .big .nav, .big .x {
      position: absolute; border: 0; background: none; color: #efe7d4; cursor: pointer;
      font-family: "EB Garamond", serif; line-height: 1; opacity: 0.7; padding: 1rem;
    }
    .big .nav:hover, .big .x:hover { opacity: 1; }
    .big .nav { top: 50%; transform: translateY(-50%); font-size: 3.5rem; }
    .big .prev { left: 1vw; }
    .big .next { right: 1vw; }
    .big .x { top: 0.5rem; right: 1vw; font-size: 2.4rem; }
    .big button:focus { outline: none; }   /* no box around the × when the view opens */
    .big button:focus-visible { outline: 1px solid rgba(239,231,212,0.4); }

    @media (max-width: 600px) {
      .version { display: none; }
      .sheet { columns: 2 120px; }
      .big .nav { font-size: 2.6rem; padding: 0.5rem; }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="version">v0.9.10<span>27 Nov 2026</span></div>
    <div class="menu">
      <a href="index.html" aria-haspopup="true">music</a>
      <div class="sub">
        <a href="index.html">covers</a>
        <a href="albums.html">list of albums</a>
      </div>
    </div>
    <a href="drawings.html" aria-current="page">drawings</a>
    <a href="#">laziness</a>
  </nav>

  <div class="sheet"></div>

  <div class="big" role="dialog" aria-modal="true" aria-label="Drawing" aria-hidden="true">
    <button class="x" aria-label="Close">&times;</button>
    <button class="nav prev" aria-label="Previous drawing">&lsaquo;</button>
    <div class="mat"><img src="" alt=""></div>
    <p></p>
    <button class="nav next" aria-label="Next drawing">&rsaquo;</button>
  </div>

  <script>
  /* THE DRAWINGS - to add one: put the picture in images/drawings/ and add a line
     here: ["file.jpg", "caption"]. They show in this order, newest first if you
     put new ones at the top. */
  var DRAWINGS = [
    ["drawing-coffee-pot-by-window.jpg",   "Coffee pot by the window"],
    ["drawing-trumpet-player.jpg",         "Trumpet player"],
    ["drawing-after-millet-gleaners.jpg",  "Study after Millet, The Gleaners"],
    ["drawing-bassist-bent-over.jpg",      "Bass player, bent over"],
    ["drawing-after-caillebotte-rowers.jpg","Study after Caillebotte, rowers"],
    ["drawing-poplars-by-the-road.jpg",    "Poplars by the road"],
    ["drawing-triade.jpg",                 "Triade"],
    ["drawing-three-faces-ink.jpg",        "Three faces, ink"],
    ["drawing-snowy-forest-window.jpg",    "Snowy forest through the window"],
    ["drawing-jazz-trio-on-stage.jpg",     "Jazz trio on stage"],
    ["drawing-supersister.jpg",            "Supersister"],
    ["drawing-face-with-glasses-ink.jpg",  "Face with glasses, ink and pencil"],
    ["drawing-church-portico.jpg",         "Church portico under the trees"],
    ["drawing-portico-in-colour.jpg",      "Portico in colour"],
    ["drawing-clearing-in-the-trees.jpg",  "Clearing in the trees"],
    ["drawing-road-with-tall-trees.jpg",   "Road with tall trees"],
    ["drawing-figure-with-umbrella.jpg",   "Figure with an umbrella"],
    ["drawing-smiling-face-sketchbook.jpg","Smiling face in the sketchbook"],
    ["drawing-guitarist-ink.jpg",          "Guitarist, ink"],
    ["drawing-trees-by-the-road.jpg",      "Trees by the road"],
    ["drawing-badacsony-woods.jpg",        "Badacsony woods, April 2023"],
    ["drawing-winding-path.jpg",           "Winding path"],
    ["drawing-market-stalls.jpg",          "Market stalls"],
    ["drawing-guitarist-pencil.jpg",       "Guitarist, pencil"],
    ["drawing-face-behind-hair.jpg",       "Face behind the hair"],
    ["drawing-man-with-tilted-head.jpg",   "Man with his head tilted"],
    ["drawing-dark-garden-path.jpg",       "Dark garden path"],
    ["drawing-face-in-hatching.jpg",       "Face in hatching"],
    ["drawing-house-behind-tree.jpg",      "House behind a tree"],
    ["drawing-people-at-table.jpg",        "People around a table"],
    ["drawing-still-life-ink.jpg",         "Still life in ink"],
    ["drawing-man-in-wide-hat.jpg",        "Man in a wide hat"],
    ["drawing-man-at-bar.jpg",             "Man at the bar"],
    ["drawing-street-with-lamp.jpg",       "Street with a lamp post"],
    ["drawing-pencil-storm-face.jpg",      "Face in a pencil storm"],
    ["drawing-four-with-guitars.jpg",      "Four of them, with guitars"],
    ["drawing-head-bent-down.jpg",         "Head bent down"],
    ["drawing-lone-tree-field.jpg",        "Lone tree in a field"],
    ["drawing-at-the-table.jpg",           "At the table"],
    ["drawing-green-lamp-room.jpg",        "Room with a lamp, in green"],
    ["drawing-garden-table.jpg",           "Table in the garden"],
    ["drawing-after-degas-tub.jpg",        "Study after Degas, The Tub"],
    ["drawing-after-van-gogh-boats.jpg",   "Study after Van Gogh, boats on the beach"],
    ["drawing-old-face-pencil.jpg",        "Old face, pencil"],
    ["drawing-after-monet-parasol.jpg",    "Study after Monet, woman with a parasol"],
    ["drawing-house-through-trees.jpg",    "House through the trees"],
    ["drawing-snowy-barn.jpg",             "Barn in the snow"],
    ["drawing-face-close-up.jpg",          "Face, close up"],
    ["drawing-night-window.jpg",           "By the window at night"],
    ["drawing-blue-pen-face.jpg",          "Face in blue pen"],
    ["drawing-face-in-shadow.jpg",         "Face in shadow"],
    ["drawing-walk-with-child.jpg",        "Walk with a child"],
    ["drawing-red-and-words.jpg",          "Red, with words"],
    ["drawing-scribble-hand.jpg",          "Scribbles and a hand"],
    ["drawing-two-trees-framed.jpg",       "Two trees"],
    ["drawing-bearded-man-cap.jpg",        "Bearded man in a cap"],
    ["drawing-seated-with-stick.jpg",      "Seated, with a stick"],
    ["drawing-tree-and-hills.jpg",         "Tree and hills"],
    ["drawing-village-street.jpg",         "Village street"],
    ["drawing-figures-with-words.jpg",     "Figures, with words"],
    ["drawing-house-by-the-rails.jpg",     "House by the railway"],
    ["drawing-colour-group-lettering.jpg", "Group in the green, with lettering"],
    ["drawing-bottle-and-glass.jpg",       "Bottle and glass"],
    ["drawing-abstract-dark-gold.jpg",     "Dark and gold"],
    ["drawing-sailor-cap.jpg",             "Sailor in a cap"],
    ["drawing-long-hair-bowed.jpg",   "Long hair, head bowed"],
    ["drawing-woman-with-guitar.jpg", "Woman with a guitar"],
    ["drawing-omega.jpg",             "Omega"],
    ["drawing-hat-and-round-eyes.jpg","Hat and round eyes"],
    ["drawing-figure-on-hill.jpg",    "Figure on a hill"],
    ["drawing-colour-figures.jpg",    "Figures in colour"],
    ["drawing-man-with-glasses.jpg",  "Man with glasses"],
    ["drawing-house-at-night.jpg",    "House at night"],
    ["drawing-two-benches.jpg",       "Two benches in the park"],
    ["drawing-bearded-face-words.jpg","Bearded face, with words"],
    ["drawing-sleigh-in-snow.jpg",    "Sleigh in the snow"],
    ["drawing-house-red-roof.jpg",    "House with a red roof"],
    ["drawing-trees-red-roofs.jpg",   "Trees and red roofs"],
    ["drawing-forest-path.jpg",       "Path through the trees"],
    ["drawing-chair-words.jpg",       "Chair, with words"],
    ["drawing-two-trees-road.jpg",    "Two trees by a country road"],
    ["drawing-musicians-ink.jpg",     "Musicians playing"],
    ["drawing-two-women-street.jpg",  "Two women in the street"],
    ["drawing-old-man-stripes.jpg",   "Old man in a striped shirt"],
    ["drawing-band-of-five.jpg",      "Group of five"],
    ["drawing-face.jpg",              "Portrait of a man"],
    ["drawing-bassist.jpg",           "Bass player in sunglasses"],
    ["drawing-celelalte-cuvinte.jpg", "Celelalte Cuvinte"],
    ["drawing-harmonica.jpg",         "Musician in profile"],
    ["drawing-beard.jpg",             "Bearded man"],
    ["drawing-pianist.jpg",           "Musician at the keys"],
    ["drawing-wild-hair.jpg",         "Head with wild hair"],
    ["drawing-long-hair.jpg",         "Long-haired face"],
    ["drawing-guitar-man.jpg",        "Man with guitar"]
  ];
  var DIR = "images/drawings/";
  /* the grid shows small previews from images/drawings/thumbs/ (made by tools/make-thumbs.py);
     the enlarged view loads the full-size drawing */

  (function () {
    var sheet = document.querySelector(".sheet");
    var big = document.querySelector(".big");
    var bigImg = big.querySelector("img");
    var cap = big.querySelector("p");
    var now = 0, opener = null;

    DRAWINGS.forEach(function (d, i) {
      var b = document.createElement("button");
      b.setAttribute("aria-label", "See big: " + d[1]);
      var img = document.createElement("img");
      img.src = DIR + "thumbs/" + d[0]; img.alt = "Drawing: " + d[1]; img.loading = "lazy";
      b.appendChild(img);
      b.addEventListener("click", function () { opener = b; show(i); });
      sheet.appendChild(b);
    });

    function show(i) {
      now = (i + DRAWINGS.length) % DRAWINGS.length;
      var d = DRAWINGS[now];
      bigImg.src = DIR + d[0]; bigImg.alt = "Drawing: " + d[1];
      cap.textContent = (now + 1) + " / " + DRAWINGS.length;   // no caption under the big drawing (v0.9.1)
      big.classList.add("open"); big.setAttribute("aria-hidden", "false");
      big.querySelector(".x").focus();
    }
    function close() {
      big.classList.remove("open"); big.setAttribute("aria-hidden", "true");
      if (opener) opener.focus();
    }

    big.querySelector(".prev").addEventListener("click", function (e) { e.stopPropagation(); show(now - 1); });
    big.querySelector(".next").addEventListener("click", function (e) { e.stopPropagation(); show(now + 1); });
    big.querySelector(".x").addEventListener("click", close);
    big.addEventListener("click", function (e) { if (e.target === big || e.target === bigImg || e.target === bigImg.parentNode) close(); });

    document.addEventListener("keydown", function (e) {
      if (!big.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") show(now - 1);
      if (e.key === "ArrowRight") show(now + 1);
    });

    // coming from the music page (drawings.html#file.jpg): open that drawing straight away
    var want = decodeURIComponent(location.hash.slice(1));
    if (want) DRAWINGS.forEach(function (d, i) { if (d[0] === want) show(i); });

    // phones: swipe left / right to move between drawings
    var x0 = null;
    big.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    big.addEventListener("touchend", function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) show(now + (dx < 0 ? 1 : -1));
    });
  })();
  </script>
  <script>
  /* v0.9.8: on touch screens the first tap on "music" opens its menu, the second follows the link */
  (function () {
    document.querySelectorAll(".topbar .menu").forEach(function (m) {
      m.querySelector("a").addEventListener("click", function (e) {
        if (window.matchMedia("(hover: none)").matches && !m.classList.contains("open")) {
          e.preventDefault(); m.classList.add("open");
        }
      });
      document.addEventListener("click", function (e) { if (!m.contains(e.target)) m.classList.remove("open"); });
    });
  })();
  </script>
</body>
</html>
